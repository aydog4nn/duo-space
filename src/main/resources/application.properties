spring.application.name=manitimle-proje
spring.web.resources.static-locations=classpath:/static/,file:./frontend/

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/duo_space}
spring.datasource.username=${DB_USERNAME:duo_user}
spring.datasource.password=${DB_PASSWORD:duo_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
