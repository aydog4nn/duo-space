services:
  postgres:
    image: postgres:17-alpine
    container_name: duo-space-postgres
    environment:
      POSTGRES_DB: duo_space
      POSTGRES_USER: duo_user
      POSTGRES_PASSWORD: duo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duo_user -d duo_space"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: duo-space-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/duo_space
      DB_USERNAME: duo_user
      DB_PASSWORD: duo_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
